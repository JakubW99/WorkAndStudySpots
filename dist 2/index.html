    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height — use dvh for mobile browsers */
      html,
      body {
        height: 100%;
        height: 100dvh; /* dynamic viewport height — accounts for mobile browser chrome */
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* iOS Safari safe area: pad the entire page so content doesn't hide behind notch/home bar */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /*
       * Wymuszenie pobrania ikon z CDN — nadpisuje hashowane ścieżki generowane przez Expo.
       * Expo/react-native-web generuje @font-face z lokalnymi ścieżkami do node_modules,
       * które nie istnieją na Netlify. Ta reguła ma wyższy priorytet dzięki !important.
       */
      @font-face {
        font-family: 'Ionicons';
        src: url('https://unpkg.com/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/Ionicons.ttf') format('truetype') !important;
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /* Klasa pomocnicza: padding-top z safe-area dla ekranów na webie mobilnym */
      .wss-web-safe-top {
        padding-top: env(safe-area-inset-top);
      }
    </style>
